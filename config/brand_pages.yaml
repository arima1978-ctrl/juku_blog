# 自社のブランドページ(そろばん・英会話・習字・プログラミング・将棋等)のレジストリ。
# config/school_pages.yaml(校舎ページ)と同じ思想だが、ブランドページはどの塾の校舎にも
# 属さないサイト全体共通のページのため、branch_idを持たない(2026-07-29ユーザー承認)。
#
# 重要な制約:
# - 競合設定(config/seo_competitors.yaml)とは完全に分離する(混同・共用しないこと)。
# - urlは https:// のみ許可する。
# - wp_page_idはPage Draft反映(scripts/seo_brand_page_draft_apply.js)がREST API
#   (/wp-json/wp/v2/pages/<id>)を呼ぶために使う。ページ本文の取得自体は既存の
#   page_context_provider.js(素のHTTP取得、REST不使用)を使うため、wp_page_idが
#   無くてもPage Plan/Page Draft生成自体は可能(反映のみwp_page_idが必須)。
#
# フィールド:
#   id               : 一意な識別子(重複禁止)
#   name             : 表示名(ダッシュボード表示用)
#   url              : ブランドページの実URL(https必須)
#   wp_page_id       : WordPress側のページID(REST反映に使用)
#   page_type        : ページ種別(現時点では "brand_page" のみ使用)
#   content_category : このページの習い事/塾カテゴリ("naraigoto"固定。GSC生クエリの
#                       辞書分類とは別に、レジストリ側で確定値として持つ)
#   target_keywords  : このページが対応するキーワード群(1件以上必須)
#   enabled          : false にすると一覧・マッチング対象から除外される(既定true)

brand_pages:
  - id: soroban
    name: "そろばんクラブ"
    url: "https://an-english.com/brand/ansorobanclub/"
    wp_page_id: 574
    page_type: "brand_page"
    content_category: "naraigoto"
    target_keywords:
      - "そろばん"
      - "珠算"
    enabled: true

  - id: eikaiwa
    name: "英会話クラブ(AEClub)"
    url: "https://an-english.com/brand/aeclub/"
    wp_page_id: 546
    page_type: "brand_page"
    content_category: "naraigoto"
    target_keywords:
      - "英会話"
      - "英語教室"
    enabled: true

  - id: shodo
    name: "習字・美文字"
    url: "https://an-english.com/brand/anbimoji/"
    wp_page_id: 576
    page_type: "brand_page"
    content_category: "naraigoto"
    target_keywords:
      - "習字"
      - "書道"
    enabled: true

  - id: programming
    name: "プログラミング教室"
    url: "https://an-english.com/brand/anprogramming/"
    wp_page_id: 578
    page_type: "brand_page"
    content_category: "naraigoto"
    target_keywords:
      - "プログラミング"
      - "マイクラ"
      - "ロボット教室"
    enabled: true

  - id: shogi
    name: "将棋クラブ"
    url: "https://an-english.com/brand/anshogiclub/"
    wp_page_id: 580
    page_type: "brand_page"
    content_category: "naraigoto"
    target_keywords:
      - "将棋"
    enabled: true
